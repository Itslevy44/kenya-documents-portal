name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, gd, curl, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        env:
          COMPOSER_NO_AUDIT: 1
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0

      - name: Set up .env and generate app key
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          PAYHERO_BASIC_AUTH: ${{ secrets.PAYHERO_BASIC_AUTH }}
          PAYHERO_CHANNEL_ID: ${{ secrets.PAYHERO_CHANNEL_ID }}
          PAYHERO_WEBHOOK_SECRET: ${{ secrets.PAYHERO_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          cp .env.example .env
          php -r '
            $vars = [
              "APP_KEY"                => getenv("APP_KEY"),
              "DB_HOST"                => getenv("DB_HOST"),
              "DB_DATABASE"            => getenv("DB_DATABASE"),
              "DB_USERNAME"            => getenv("DB_USERNAME"),
              "DB_PASSWORD"            => getenv("DB_PASSWORD"),
              "AT_USERNAME"            => getenv("AT_USERNAME"),
              "AT_API_KEY"             => getenv("AT_API_KEY"),
              "PAYHERO_BASIC_AUTH"     => getenv("PAYHERO_BASIC_AUTH"),
              "PAYHERO_CHANNEL_ID"     => getenv("PAYHERO_CHANNEL_ID"),
              "PAYHERO_WEBHOOK_SECRET" => getenv("PAYHERO_WEBHOOK_SECRET"),
              "TELEGRAM_BOT_TOKEN"     => getenv("TELEGRAM_BOT_TOKEN"),
              "TELEGRAM_CHANNEL_ID"    => getenv("TELEGRAM_CHANNEL_ID"),
            ];
            $lines = file(".env", FILE_IGNORE_NEW_LINES);
            $updated = [];
            foreach ($lines as &$line) {
              $trimmed = trim($line);
              if ($trimmed === "" || str_starts_with($trimmed, "#") || !str_contains($line, "=")) {
                continue;
              }
              [$k] = explode("=", $line, 2);
              $k = trim($k);
              if (array_key_exists($k, $vars) && $vars[$k] !== false && $vars[$k] !== "") {
                $v = trim($vars[$k]);
                if ((str_starts_with($v, "\"") && str_ends_with($v, "\"")) || (str_starts_with($v, "\x27") && str_ends_with($v, "\x27"))) {
                  $v = substr($v, 1, -1);
                }
                $escaped = str_replace(["\\", "\""], ["\\\\", "\\\""], $v);
                $line = "{$k}=\"{$escaped}\"";
                $updated[$k] = true;
              }
            }
            foreach ($vars as $k => $v) {
              if (!isset($updated[$k]) && $v !== false && $v !== "") {
                $v = trim($v);
                if ((str_starts_with($v, "\"") && str_ends_with($v, "\"")) || (str_starts_with($v, "\x27") && str_ends_with($v, "\x27"))) {
                  $v = substr($v, 1, -1);
                }
                $escaped = str_replace(["\\", "\""], ["\\\\", "\\\""], $v);
                $lines[] = "{$k}=\"{$escaped}\"";
              }
            }
            file_put_contents(".env", implode("\n", $lines) . "\n");
          '
          if ! grep -q '^APP_KEY=.' .env; then
            php artisan key:generate --force
          fi

      - name: Optimise Laravel (cache config, routes, views)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # ── Deploy Laravel app to htdocs/laravel_app/ ──────────────────────
      - name: Deploy Laravel app via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/laravel_app/
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/**
            **/.env.example
            **/database/*.sql

      # ── Deploy public/ contents to htdocs/ (web root) ──────────────────
      - name: Deploy public folder to htdocs via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /htdocs/
          exclude: |
            **/.git/**
